[project]
name = "cmp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dash",
    "plotly",
    "netCDF4",
    "numpy",
    "numexpr",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

# Dash callbacks use opaque dynamic return shapes (patches, tuples-of-outputs,
# no_update sentinels). Relaxing the strictness there avoids noise without
# giving up typing elsewhere in the codebase.
[[tool.mypy.overrides]]
module = ["app.callbacks.*"]
disallow_untyped_defs = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator (readability)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
